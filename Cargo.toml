[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Nachtalb <na@nachtalb.io>"]
publish = false

[workspace.dependencies]
nookle-core = { path = "crates/nookle-core" }
nookle-media = { path = "crates/nookle-media" }
nookle-fetch = { path = "crates/nookle-fetch" }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }

[profile.release]
strip = true
lto = "thin"
