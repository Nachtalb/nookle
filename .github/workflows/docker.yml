name: Docker
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  # The backend Dockerfile yields three images (api, bot, tagger) from one compile. They build
  # in ONE job, one after the other: the first fills the builder, the next two only export.
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - file: Dockerfile
            cache: nookle
            images: "api:nookle bot:nookle-bot tagger:nookle-tagger"
          - file: Dockerfile.web
            cache: nookle-web
            images: "web:nookle-web"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Layer cache lives in its own GHCR package, not the 10 GB Actions cache, so the
      # from-source ffmpeg stage is not evicted after a quiet week.
      - name: build and push
        env:
          CACHE: ghcr.io/nachtalb/nookle-buildcache:${{ matrix.cache }}
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          first=1
          for pair in ${{ matrix.images }}; do
            target=${pair%%:*} image=ghcr.io/nachtalb/${pair#*:}
            to=()
            [ "$first" = 1 ] && to=(--cache-to "type=registry,ref=$CACHE,mode=max,image-manifest=true,oci-mediatypes=true")
            [ "$target" = web ] && target_arg=() || target_arg=(--target "$target")
            docker buildx build -f ${{ matrix.file }} "${target_arg[@]}" --push \
              --cache-from "type=registry,ref=$CACHE" "${to[@]}" \
              -t "$image:sha-$SHORT" -t "$image:latest" .
            first=0
          done
