name: Docker
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: nookle
            file: Dockerfile
          - name: nookle-web
            file: Dockerfile.web
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/nachtalb/${{ matrix.name }}:sha-${{ steps.sha.outputs.short }}
            ghcr.io/nachtalb/${{ matrix.name }}:latest
          # Layer cache lives in its own GHCR package, not the 10 GB Actions cache, so the
          # from-source ffmpeg stage is not evicted after a quiet week.
          cache-from: |
            type=registry,ref=ghcr.io/nachtalb/nookle-buildcache:${{ matrix.name }}
            type=gha,scope=${{ matrix.name }}
          cache-to: type=registry,ref=ghcr.io/nachtalb/nookle-buildcache:${{ matrix.name }},mode=max,image-manifest=true,oci-mediatypes=true
