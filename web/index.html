<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#282828" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbf1c7" media="(prefers-color-scheme: light)">
<title>Nookle</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/vendor/emoji.min.js"></script>
<script type="module" src="/app.js"></script>
</head>
<body>

<section id="login" hidden>
  <form id="login-form">
    <h1>Nookle</h1>
    <input name="password" type="password" placeholder="Password or API key" autocomplete="current-password" required autofocus>
    <button>Log in</button>
    <p class="error" id="login-error"></p>
  </form>
</section>

<section id="app" hidden>
  <header>
    <div class="bar">
      <strong class="logo">Nookle</strong>
      <span class="badge" id="scope"></span>
      <span class="spacer"></span>
      <button class="rw" id="open-upload" title="Upload">＋ Add</button>
      <button class="admin icon" id="open-keys" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button class="icon" id="logout" title="Log out" aria-label="Log out"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
    <input id="q" type="search" placeholder="Search: cat gif new 😂 &quot;some phrase&quot;" autocomplete="off" enterkeyhint="search">
    <div class="bar">
      <div class="chips" id="chips"></div>
      <span class="spacer"></span>
      <div class="seg" id="sort">
        <label><input type="radio" name="sort" value="used" checked><span>Used</span></label>
        <label><input type="radio" name="sort" value="recent"><span>Recent</span></label>
        <label><input type="radio" name="sort" value="added"><span>Added</span></label>
      </div>
    </div>
  </header>
  <main id="grid"></main>
  <p class="muted center" id="grid-status"></p>
  <div id="sentinel"></div>
</section>

<dialog id="item">
  <div class="dlg-head"><span id="item-title"></span><button class="close" value="close">✕</button></div>
  <div class="media-wrap">
    <div class="media" id="item-media"></div>
    <button id="item-prev" class="step prev" title="Previous (←)" aria-label="Previous">‹</button>
    <button id="item-next" class="step next" title="Next (→)" aria-label="Next">›</button>
  </div>
  <div class="actions item-actions">
    <button id="item-share-file" class="icon" title="Share the image / video" aria-label="Share the image / video"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>
    <button id="item-share-link" class="icon" title="Share / copy the link" aria-label="Share / copy the link"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
    <button id="item-edit" class="icon rw" title="Edit" aria-label="Edit"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    <button id="item-retag" class="icon rw" title="Re-tag (hand-made tags stay)" aria-label="Re-tag (hand-made tags stay)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><path d="M7 7h.01"/><path d="M16 3.5a5 5 0 0 1 4.5 4.5"/></svg></button>
    <span class="spacer"></span>
    <button id="item-delete" class="icon rw danger" title="Delete" aria-label="Delete"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
  </div>
  <div id="item-info"></div>
  <form id="edit-form" hidden>
    <label>Text<textarea name="text" rows="3"></textarea></label>
    <label>Style<select name="style">
      <option value="">(none)</option><option>anime</option><option>cartoon</option><option>photo</option>
      <option>3d</option><option>drawing</option><option>screenshot</option><option>other</option>
    </select></label>
    <label>Sources (one URL per line)<textarea name="sources" rows="3"></textarea></label>
    <div class="actions"><button class="primary">Save</button><button type="button" id="edit-cancel">Cancel</button></div>
  </form>
</dialog>

<dialog id="upload">
  <div class="dlg-head"><span>Add memes</span><button class="close" value="close">✕</button></div>
  <label class="drop" id="drop">
    <input type="file" id="files" multiple accept="image/*,video/*" hidden>
    <span>Tap to pick, drop or paste files</span>
  </label>
  <label>Source URL (optional)<input id="up-source" type="url" placeholder="https://…"></label>
  <label>Tags (optional)<div id="up-tags"></div></label>
  <div class="actions"><button class="primary" id="up-go" disabled>Upload</button></div>
  <ul class="queue" id="up-queue"></ul>
  <h3>Import from URL</h3>
  <form id="import-form" class="row">
    <input name="url" type="url" placeholder="https://x.com/user/status/…" required>
    <button class="primary">Import</button>
  </form>
  <ul class="queue" id="import-queue"></ul>
</dialog>

<dialog id="keys">
  <div class="dlg-head"><span>Settings</span><button class="close" value="close">✕</button></div>
  <h3>Blocked tags</h3>
  <p class="muted">The tagger never adds these. Blocking a tag also removes it from every item.</p>
  <div id="blocked"></div>
  <h3>API keys</h3>
  <form id="key-form" class="row">
    <input name="name" placeholder="Name" required>
    <select name="scope"><option>ro</option><option>rw</option></select>
    <button class="primary">Create</button>
  </form>
  <div id="new-key" hidden>
    <p>New key, shown only once:</p>
    <div class="row"><input id="new-key-value" readonly><button id="new-key-copy">Copy</button></div>
  </div>
  <ul class="keys" id="key-list"></ul>
</dialog>

<div id="toast" aria-live="polite"></div>
</body>
</html>
